<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POE2 开荒攻略站</title>
    <meta
      name="description"
      content="流放之路 2 开荒地图、升华职业预览与 poe.ninja 热门 BD 本地缓存。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-top">
        <div class="site-brand">
          <p class="eyebrow" data-i18n="site.kicker">POE2 Guide</p>
          <h1 data-i18n="site.title">POE2 开荒攻略站</h1>
          <p data-i18n="site.copy">
            章节地图、升华职业和忍者网 BD 都走本地缓存；顶部直接看 GGG 官方蓝贴。
          </p>
        </div>

        <section class="ggg-news" aria-labelledby="ggg-news-title">
          <div class="ggg-news__header">
            <div>
              <p class="section-kicker" data-i18n="news.kicker">GGG 蓝贴</p>
              <h2 id="ggg-news-title" data-i18n="news.title">官方公告</h2>
            </div>
            <a
              class="ggg-news__all"
              href="https://pathofexile2.com/news"
              target="_blank"
              rel="noopener"
              data-i18n="news.openAll"
            >
              打开官网新闻
            </a>
          </div>
          <div class="ggg-news-list" id="ggg-news-list"></div>
        </section>

        <div class="language-switcher" data-language-switcher aria-label="Language">
          <button class="is-active" type="button" data-language="zh" aria-pressed="true">
            中
          </button>
          <button type="button" data-language="en" aria-pressed="false">
            EN
          </button>
        </div>
      </header>

      <main class="content">
        <nav class="tabbar" aria-label="内容切换">
          <button
            class="tabbar__button is-active"
            type="button"
            data-tab-button="world"
            aria-pressed="true"
          >
            <span data-i18n="tabs.world">开荒攻略</span>
          </button>
          <button
            class="tabbar__button"
            type="button"
            data-tab-button="classes"
            aria-pressed="false"
          >
            <span data-i18n="tabs.classes">职业预览</span>
          </button>
          <button
            class="tabbar__button"
            type="button"
            data-tab-button="builds"
            aria-pressed="false"
          >
            <span data-i18n="tabs.builds">最新 BD</span>
          </button>
        </nav>

        <section
          id="world-panel"
          class="panel is-active"
          data-tab-panel="world"
          aria-labelledby="开荒攻略"
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="world.kicker">章节总览</p>
              <h2 data-i18n="world.title">开荒地图与编号掉落</h2>
            </div>
            <p class="section-copy" data-i18n="world.copy">
              按章节/上下层查看完整世界地图，右侧对应图中编号列出奖励、掉落和永久能力。
            </p>
          </div>

          <div class="world-map-tabs" id="world-map-tabs"></div>
          <div class="world-map-shell" id="world-map-view"></div>
        </section>

        <section
          id="classes-panel"
          class="panel"
          data-tab-panel="classes"
          aria-labelledby="职业预览"
          hidden
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="classes.kicker">PoE2DB 编年史</p>
              <h2 data-i18n="classes.title">职业升华差异预览</h2>
            </div>
            <p class="section-copy" data-i18n="classes.copy">
              按基础职业查看已开放升华，卡片内列出编年史爬取到的关键升华天赋效果。
            </p>
          </div>

          <div class="classes-grid" id="classes-grid"></div>
        </section>

        <section
          id="builds-panel"
          class="panel"
          data-tab-panel="builds"
          aria-labelledby="最新 BD"
          hidden
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="builds.kicker">Poe Ninja</p>
              <h2 data-i18n="builds.title">当前职业热度排行</h2>
            </div>
            <p class="section-copy" data-i18n="builds.copy">
              展示当前联赛 poe.ninja 职业占比排行，卡片可直接跳转到忍者网对应职业筛选。
            </p>
          </div>

          <div class="builds-summary" id="builds-summary"></div>
          <div class="build-grid" id="builds-grid"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
    <script>
      (() => {
        const copy = {
          zh: {
            siteTitle: "POE2 开荒攻略站",
            siteCopy: "章节地图、升华职业和忍者网 BD 都走本地缓存；顶部直接看 GGG 官方蓝贴。",
            newsTitle: "官方公告",
            newsOpenAll: "打开官网新闻",
            newsOpen: "查看原帖",
            classes: "职业预览",
            builds: "最新 BD",
            notables: "关键升华天赋",
            empty: "这个职业暂时没有开放升华。",
            openChronicle: "打开编年史",
            openNinja: "查看忍者网",
            cached: "本地缓存",
            updated: "BD 更新于 ",
          },
          en: {
            siteTitle: "POE2 Campaign Guide",
            siteCopy: "Campaign maps, ascendancies, and poe.ninja builds are cached locally, with official GGG blue posts up top.",
            newsTitle: "Official Announcements",
            newsOpenAll: "Open official news",
            newsOpen: "Read source",
            classes: "Class Preview",
            builds: "Builds",
            notables: "Key ascendancy notables",
            empty: "No ascendancy is currently listed for this class.",
            openChronicle: "Open PoE2DB",
            openNinja: "Open poe.ninja",
            cached: "Local cache",
            updated: "Builds updated ",
          },
        };

        const readJson = (id) => JSON.parse(document.getElementById(id).textContent);
        const localize = (entity, language) => ({
          ...entity,
          ...(entity.localized?.[language] || entity.localized?.zh || {}),
        });
        const state = {
          language: localStorage.getItem("poe2-guide-language") === "en" ? "en" : "zh",
          worldMaps: readJson("world-maps-data"),
          ascendancies: readJson("ascendancies-data"),
          builds: readJson("builds-data"),
          gggNews: readJson("ggg-news-data"),
        };

        const renderAscendancy = (ascendancy) => {
          const labels = copy[state.language];
          const item = localize(ascendancy, state.language);
          const notables = ascendancy.notables.length
            ? ascendancy.notables.map((notable) => {
              const localized = localize(notable, state.language);
              return `<li><strong>${localized.name}</strong><span>${localized.effect}</span></li>`;
            }).join("")
            : `<li><span>${labels.empty}</span></li>`;
          return `<article class="ascendancy-card">
            <div class="ascendancy-card__head"><img src="${ascendancy.image}" alt="${item.name}" loading="lazy"><div><h3>${item.name}</h3><p>${ascendancy.englishName}</p></div></div>
            <div class="detail-block"><strong>${labels.notables}</strong><ul class="ascendancy-notables">${notables}</ul></div>
            <a class="source-note source-note--link" href="${ascendancy.sourceUrl}" target="_blank" rel="noopener">${labels.openChronicle}</a>
          </article>`;
        };

        const renderClass = (ascendancyClass) => {
          const item = localize(ascendancyClass, state.language);
          const labels = copy[state.language];
          const ascendancies = ascendancyClass.ascendancies.length
            ? ascendancyClass.ascendancies.map(renderAscendancy).join("")
            : `<div class="empty-state">${labels.empty}</div>`;
          return `<section class="class-preview-card">
            <div class="class-preview-card__header"><img src="${ascendancyClass.image}" alt="${item.name}" loading="lazy"><div><p>${ascendancyClass.englishName}</p><h3>${item.name}</h3></div></div>
            <div class="ascendancy-grid">${ascendancies}</div>
          </section>`;
        };

        const renderBuild = (build) => {
          const item = localize(build, state.language);
          return `<a class="build-card build-card--link" href="${build.href}" target="_blank" rel="noopener">
            <div class="build-card__image"><img src="${build.image}" alt="${item.className}" loading="lazy"></div>
            <div class="build-card__header"><div><span class="rank-label">#${build.rank || "-"}</span><h3>${item.className}</h3><p>${item.leagueName} · ${build.className}</p></div><div class="build-tag">${build.popularity}%</div></div>
            <p>${item.summary}</p>
            <div class="build-meta">${item.tags.map((tag) => `<span class="build-tag">${tag}</span>`).join("")}</div>
            <div class="source-note">${copy[state.language].openNinja}: poe.ninja</div>
          </a>`;
        };

        const renderNews = (item) => {
          const labels = copy[state.language];
          const news = localize(item, state.language);
          const date = new Date(item.date).toLocaleDateString(state.language === "en" ? "en-US" : "zh-CN", { month: "short", day: "numeric" });
          return `<a class="ggg-news-item" href="${item.href}" target="_blank" rel="noopener">
            <span class="ggg-news-item__date">${date}</span>
            <span class="ggg-news-item__body"><strong>${news.title}</strong><small>${news.category} · ${labels.newsOpen}</small></span>
          </a>`;
        };

        const renderFallbackApp = () => {
          const labels = copy[state.language];
          document.documentElement.lang = state.language === "en" ? "en" : "zh-CN";
          document.querySelector('[data-i18n="site.title"]').textContent = labels.siteTitle;
          document.querySelector('[data-i18n="site.copy"]').textContent = labels.siteCopy;
          document.querySelector('[data-i18n="news.title"]').textContent = labels.newsTitle;
          document.querySelector('[data-i18n="news.openAll"]').textContent = labels.newsOpenAll;
          document.querySelector('[data-tab-button="classes"] span').textContent = labels.classes;
          document.querySelector('[data-tab-button="builds"] span').textContent = labels.builds;
          document.getElementById("ggg-news-list").innerHTML = state.gggNews.items.map(renderNews).join("");
          document.getElementById("classes-grid").innerHTML = state.ascendancies.classes.map(renderClass).join("");
          document.getElementById("builds-summary").innerHTML = `<article class="summary-card"><p>${state.builds.leagueName}</p><h3>${state.builds.builds[0].className}</h3><strong>${state.builds.builds[0].popularity}%</strong></article><article class="summary-card"><p>${labels.cached}</p><h3>${labels.builds}</h3><strong>${state.builds.builds.length}</strong></article>`;
          document.getElementById("builds-grid").innerHTML = state.builds.builds.map(renderBuild).join("");
        };

        const setupFallbackEvents = () => {
          document.querySelector("[data-language-switcher]").addEventListener("click", (event) => {
            const button = event.target.closest("[data-language]");
            if (!button) return;
            state.language = button.dataset.language === "en" ? "en" : "zh";
            localStorage.setItem("poe2-guide-language", state.language);
            document.querySelectorAll("[data-language]").forEach((item) => {
              const active = item.dataset.language === state.language;
              item.classList.toggle("is-active", active);
              item.setAttribute("aria-pressed", String(active));
            });
            renderFallbackApp();
          });
          document.querySelectorAll("[data-tab-button]").forEach((button) => {
            button.addEventListener("click", () => {
              document.querySelectorAll("[data-tab-button]").forEach((item) => item.classList.toggle("is-active", item === button));
              document.querySelectorAll("[data-tab-panel]").forEach((panel) => {
                const active = panel.dataset.tabPanel === button.dataset.tabButton;
                panel.classList.toggle("is-active", active);
                panel.hidden = !active;
              });
            });
          });
        };

        window.addEventListener("DOMContentLoaded", () => {
          setTimeout(() => {
            if (document.querySelectorAll(".world-map-viewer, .class-preview-card, .build-card").length > 0) return;
            renderFallbackApp();
            setupFallbackEvents();
          }, 100);
        });
      })();
    </script>
  </body>
</html>
