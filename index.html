<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POE2 开荒攻略站</title>
    <meta
      name="description"
      content="流放之路 2 地图攻略与 poe.ninja 热门 BD 本地缓存。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero" style="background-image: var(--hero-image)">
        <div class="language-switcher" data-language-switcher aria-label="Language">
          <button class="is-active" type="button" data-language="zh" aria-pressed="true">
            中
          </button>
          <button type="button" data-language="en" aria-pressed="false">
            EN
          </button>
        </div>
        <div class="hero__glass">
          <p class="eyebrow" data-i18n="hero.eyebrow">POE2 Guide</p>
          <h1 data-i18n="hero.title">地图攻略 + 最新 BD</h1>
          <p class="hero__copy" data-i18n="hero.copy">
            适合开荒时顺手查图、看奖励、盯热门流派。地图与 BD
            都在站内展示，来源由爬虫同步后本地缓存。
          </p>
          <div class="hero__meta">
            <span id="maps-count" data-i18n="hero.mapsLoading">0 张地图</span>
            <span id="builds-updated" data-i18n="hero.buildsLoading">BD 数据加载中</span>
          </div>
        </div>
      </header>

      <main class="content">
        <nav class="tabbar" aria-label="内容切换">
          <button
            class="tabbar__button is-active"
            type="button"
            data-tab-button="world"
            aria-pressed="true"
          >
            <span data-i18n="tabs.world">世界地图</span>
          </button>
          <button
            class="tabbar__button"
            type="button"
            data-tab-button="maps"
            aria-pressed="false"
          >
            <span data-i18n="tabs.maps">地图攻略</span>
          </button>
          <button
            class="tabbar__button"
            type="button"
            data-tab-button="builds"
            aria-pressed="false"
          >
            <span data-i18n="tabs.builds">最新 BD</span>
          </button>
        </nav>

        <section
          id="world-panel"
          class="panel is-active"
          data-tab-panel="world"
          aria-labelledby="世界地图"
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="world.kicker">章节总览</p>
              <h2 data-i18n="world.title">世界地图与编号掉落</h2>
            </div>
            <p class="section-copy" data-i18n="world.copy">
              按章节/上下层查看完整世界地图，右侧对应图中编号列出奖励、掉落和永久能力。
            </p>
          </div>

          <div class="world-map-tabs" id="world-map-tabs"></div>
          <div class="world-map-shell" id="world-map-view"></div>
        </section>

        <section
          id="maps-panel"
          class="panel"
          data-tab-panel="maps"
          aria-labelledby="地图攻略"
          hidden
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="maps.kicker">精选地图</p>
              <h2 data-i18n="maps.title">地图攻略与掉落标注</h2>
            </div>
            <p class="section-copy" data-i18n="maps.copy">
              收录公开可验证的地图、路线和奖励信息，方便开荒时按掉落类型筛选。
            </p>
          </div>

          <div class="filters" id="map-filters"></div>
          <div class="card-grid" id="maps-grid"></div>
        </section>

        <section
          id="builds-panel"
          class="panel"
          data-tab-panel="builds"
          aria-labelledby="最新 BD"
          hidden
        >
          <div class="panel__header">
            <div>
              <p class="section-kicker" data-i18n="builds.kicker">Poe Ninja</p>
              <h2 data-i18n="builds.title">当前热门 BD 趋势</h2>
            </div>
            <p class="section-copy" data-i18n="builds.copy">
              展示当前联赛最热升华与占比趋势，数据由爬虫同步到本地后直接展示。
            </p>
          </div>

          <div class="builds-summary" id="builds-summary"></div>
          <div class="build-grid" id="builds-grid"></div>
        </section>
      </main>
    </div>

            <div class="drop-list">${item.drops.map((drop) => `<span class="drop-pill">${drop}</span>`).join("")}</div>
            <div class="detail-block"><strong>${labels.route}</strong><p>${item.route}</p></div>
            <div class="detail-block"><strong>${labels.checkpoints}</strong><ul class="checkpoint-list">${item.checkpoints.map((checkpoint) => `<li>${checkpoint}</li>`).join("")}</ul></div>
            <div class="source-note">${labels.source}: ${map.sourceName} · ${labels.cached}</div>
          </article>`;
        };

        const renderBuild = (build) => {
          const item = localize(build, state.language);
          return `<article class="build-card">
            <div class="build-card__image"><img src="${build.image}" alt="${item.className}" loading="lazy"></div>
            <div class="build-card__header"><div><h3>${item.className}</h3><p>${item.leagueName}</p></div><div class="build-tag">${build.popularity}%</div></div>
            <p>${item.summary}</p>
            <div class="build-meta">${item.tags.map((tag) => `<span class="build-tag">${tag}</span>`).join("")}</div>
            <div class="source-note">${copy[state.language].cached}: poe.ninja</div>
          </article>`;
        };

        const renderFallbackApp = () => {
          const labels = copy[state.language];
          const maps = state.activeTag === "all"
            ? state.maps
            : state.maps.filter((map) => map.tags.includes(state.activeTag));
          document.documentElement.lang = state.language === "en" ? "en" : "zh-CN";
          document.querySelector('[data-tab-button="maps"] span').textContent = labels.maps;
          document.querySelector('[data-tab-button="builds"] span').textContent = labels.builds;
          document.getElementById("maps-count").textContent = labels.mapCount(state.maps.length);
          document.getElementById("builds-updated").textContent = `${labels.updated}${new Date(state.builds.updatedAt).toLocaleString(state.language === "en" ? "en-US" : "zh-CN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}`;
          document.getElementById("map-filters").innerHTML = labels.filters.map(([value, label]) => `<button type="button" class="filter-chip ${value === state.activeTag ? "is-active" : ""}" data-filter-tag="${value}">${label}</button>`).join("");
          document.getElementById("maps-grid").innerHTML = maps.map(renderMap).join("");
          document.getElementById("builds-summary").innerHTML = `<article class="summary-card"><p>${state.builds.leagueName}</p><h3>${state.builds.builds[0].className}</h3><strong>${state.builds.builds[0].popularity}%</strong></article><article class="summary-card"><p>${labels.cached}</p><h3>${labels.builds}</h3><strong>${state.builds.builds.length}</strong></article>`;
          document.getElementById("builds-grid").innerHTML = state.builds.builds.map(renderBuild).join("");
        };

        const setupFallbackEvents = () => {
          document.querySelector("[data-language-switcher]").addEventListener("click", (event) => {
            const button = event.target.closest("[data-language]");
            if (!button) return;
            state.language = button.dataset.language === "en" ? "en" : "zh";
            localStorage.setItem("poe2-guide-language", state.language);
            document.querySelectorAll("[data-language]").forEach((item) => {
              const active = item.dataset.language === state.language;
              item.classList.toggle("is-active", active);
              item.setAttribute("aria-pressed", String(active));
            });
            renderFallbackApp();
          });
          document.getElementById("map-filters").addEventListener("click", (event) => {
            const button = event.target.closest("[data-filter-tag]");
            if (!button) return;
            state.activeTag = button.dataset.filterTag;
            renderFallbackApp();
          });
          document.querySelectorAll("[data-tab-button]").forEach((button) => {
            button.addEventListener("click", () => {
              document.querySelectorAll("[data-tab-button]").forEach((item) => item.classList.toggle("is-active", item === button));
              document.querySelectorAll("[data-tab-panel]").forEach((panel) => {
                const active = panel.dataset.tabPanel === button.dataset.tabButton;
                panel.classList.toggle("is-active", active);
                panel.hidden = !active;
              });
            });
          });
        };

        window.addEventListener("DOMContentLoaded", () => {
          setTimeout(() => {
            if (document.querySelectorAll(".map-card").length > 0) return;
            renderFallbackApp();
            setupFallbackEvents();
          }, 100);
        });
      })();
    </script>
  </body>
</html>
